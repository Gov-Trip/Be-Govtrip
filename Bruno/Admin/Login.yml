info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8000/api/Login
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
            bru.setEnvVar("token", "");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
