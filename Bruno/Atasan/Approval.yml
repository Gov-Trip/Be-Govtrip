info:
  name: Approval
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8000/api/approvals/{{travel_id}}
  body:
    type: json
    data: |-
      {
        "decision": "Disetujui",
        "notes": "Agenda sudah jelas, silakan lanjutkan ke pengadaan tiket logistik."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
