info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8000/api/login
  body:
    type: json
    data: |-
      {
          "email": "manager@gov.trip",
          "password": "password123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body.data && res.body.data.access_token) {
          bru.setEnvVar("token", res.body.data.access_token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
