info:
  name: Logistik
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8000/api/logistics/{{travel_id}}
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "transport_type": "Pesawat Udara",
        "booking_code_or_ticket": "GA-312-SUB99",
        "hotel_name": "Hotel Bumi Surabaya City Resort",
        "departure_datetime": "2026-11-05 07:30:00",
        "return_datetime": "2026-11-07 19:45:00"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
